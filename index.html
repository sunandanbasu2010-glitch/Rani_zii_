<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rani Zii ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Arial,sans-serif;
    text-align:center;
    color:white;
}

.card{
    max-width:600px;
    padding:30px;
}

h1{
    font-size:2rem;
}

button{
    margin-top:20px;
    font-size:2rem;
    padding:10px 20px;
    border:none;
    border-radius:50%;
    cursor:pointer;
}

#message{
    display:none;
    margin-top:25px;
    font-size:1.3rem;
    line-height:1.8;
}
</style>
</head>

<body>

<div class="card">
    <h1>Yaar, aapko good morning wish hi nahi karna chahiye... 🥺</h1>

    <button onclick="showMessage()">❤️</button>

    <div id="message">
        Kyuki tumse hi din hota hai,<br>
        Surmayi shaam aati hai. ✨🌙
    </div>
</div>

<script>
function showMessage(){
    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
